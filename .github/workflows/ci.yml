name: HMS CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '24'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Backend Build & Test ───
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'TestP@ssword123!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TestP@ssword123!' -Q 'SELECT 1' -C"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test tests/Hms.UnitTests --no-build --configuration Release --verbosity normal

      - name: Run Integration Tests
        run: dotnet test tests/Hms.IntegrationTests --no-build --configuration Release --verbosity normal
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=HmsTestDb;User=sa;Password=TestP@ssword123!;TrustServerCertificate=True"

      - name: Check vulnerable packages
        run: dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
        continue-on-error: true

  # ─── Frontend Build & Test ───
  frontend:
    name: Frontend (Angular + React)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build design tokens
        run: pnpm --filter @hms/design-tokens build

      - name: Build Staff Portal (Angular)
        run: pnpm --filter staff-portal build

      - name: Build Clinical App (React)
        run: pnpm --filter clinical-app build

      - name: Run Staff Portal Tests
        run: pnpm --filter staff-portal test -- --run
        continue-on-error: true

      - name: Run Clinical App Tests
        run: pnpm --filter clinical-app test -- --run
        continue-on-error: true

      - name: NPM Audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true

  # ─── E2E Tests ───
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start services
        run: docker compose up -d
        
      - name: Wait for services
        run: |
          echo "Waiting for API to be ready..."
          for i in $(seq 1 30); do
            if curl -f http://localhost:5000/health/live 2>/dev/null; then
              echo "API is ready!"
              break
            fi
            echo "Attempt $i/30..."
            sleep 5
          done

      - name: Run E2E tests
        run: npx playwright test
        working-directory: e2e
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Stop services
        if: always()
        run: docker compose down
